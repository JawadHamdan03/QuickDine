services:
  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  db:
    image: mongo:7
    container_name: quickdine-db
    restart: unless-stopped
    # --quiet + low verbosity silences the per-connection log spam from the
    # healthcheck pinging every 10s.
    command: ["--quiet", "--setParameter", "logLevel=0"]
    environment:
      MONGO_INITDB_DATABASE: quick-dine
    volumes:
      - mongo-data:/data/db
    ports:
      # Exposed on the host so you can connect with Compass / mongosh if needed.
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Express API (server)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickdine-server
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    environment:
      # Point the API at the Mongo service on the compose network (overrides
      # whatever host value sits in .env.docker).
      MONGODB_URI: mongodb://db:27017/quick-dine
      PORT: "5000"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # One-shot seeder: wipes and reseeds the DB, then exits.
  # Runs only when explicitly requested (behind the "seed" profile) because
  # seed.ts clears User/Restaurant/Booking before inserting.
  #   docker compose --profile seed run --rm seed
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: quickdine-server
    profiles: ["seed"]
    restart: "no"
    env_file:
      - ./server/.env.docker
    environment:
      MONGODB_URI: mongodb://db:27017/quick-dine
      NODE_ENV: production
    command: ["npm", "run", "seed"]
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # React SPA (client) served by nginx
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. The browser reaches the API on
        # the host, so this is a host URL, NOT the "server" service name.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: quickdine-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
